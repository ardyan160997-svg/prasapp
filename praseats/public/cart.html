<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Keranjang — PrasEats</title>
  <link rel="icon" type="image/avif" href="images/praseats.avif">
  <link rel="stylesheet" href="styles.css?v=41">
  <link rel="stylesheet" href="cart.css?v=6">
</head>
<body class="cart-app">
  <header class="cart-header">
    <a href="menu.html" aria-label="Kembali ke menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
    <div><b>Keranjang PrasEats</b><small>Pesananmu hari ini</small></div>
    <a class="cart-add" href="menu.html">Tambah</a>
  </header>

  <main class="cart-shell">
    <form id="checkout">
      <section class="checkout-card order-options">
        <fieldset class="method-group">
          <legend>Metode pesanan</legend>
          <div class="choice">
            <label><input type="radio" name="fulfillmentType" value="delivery" checked><span><b>Diantar</b><small>Pilih alamat tersimpan</small></span></label>
            <label><input type="radio" name="fulfillmentType" value="pickup"><span><b>Ambil sendiri</b><small>Ambil di dapur PrasEats</small></span></label>
          </div>
        </fieldset>
      </section>

      <section class="checkout-card delivery-card">
        <div class="card-title"><span class="card-icon location-icon">⌖</span><div><small>DIANTAR KE</small><h2 id="delivery-name">Pilih alamat</h2></div></div>
        <div class="quick-address-head"><b>Quick Address</b><div class="quick-address-actions"><button type="button" id="use-location" aria-label="Ambil lokasi GPS"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><circle cx="12" cy="12" r="9"></circle><path d="M12 1v3M12 20v3M1 12h3M20 12h3"></path></svg><span>Lokasi GPS</span></button><button type="button" id="add-address-toggle">+ Alamat baru</button></div></div>
        <div id="quick-address-list" class="quick-address-list"></div>
        <div id="address-editor" class="address-editor" hidden>
          <label class="field"><span>Nama alamat</span><input id="address-label" placeholder="Rumah, Kantor, Kos"></label>
          <label class="field"><span>Alamat lengkap</span><textarea id="address-value" rows="2" placeholder="Nama jalan, nomor rumah, RT/RW"></textarea></label>
          <label class="field"><span>Patokan <small>(opsional)</small></span><textarea id="address-detail" rows="2" placeholder="Contoh: pagar hitam, depan mushola"></textarea></label>
          <label class="default-address"><input id="address-default" type="checkbox"> Jadikan alamat utama</label>
          <div class="address-editor-actions"><button type="button" id="cancel-address">Batal</button><button type="button" id="save-address">Simpan alamat</button></div>
        </div>
        <input name="customerName" type="hidden"><input name="whatsapp" type="hidden"><input name="address" type="hidden"><input name="deliveryDetail" type="hidden"><input name="latitude" type="hidden"><input name="longitude" type="hidden">
      </section>

      <section class="checkout-card items-card">
        <div class="section-title"><div><small>PESANAN</small><h2>Menu pilihanmu</h2></div><a href="menu.html">+ Tambah menu</a></div>
        <div id="cart-items"></div>
      </section>


      <section class="checkout-card payment-card">
        <div class="card-title"><span class="card-icon payment-icon">Rp</span><div><small>PEMBAYARAN</small><h2>Pilih metode pembayaran</h2></div></div>
        <label class="field payment-select"><select name="paymentMethod"><option value="qris">QRIS</option><option value="transfer">Transfer bank</option><option value="cod">COD / Bayar saat diterima</option></select></label>
        <label class="field"><span>Catatan pesanan <small>(opsional)</small></span><textarea name="notes" rows="2" placeholder="Contoh: tidak pedas, tanpa bawang"></textarea></label>
      </section>

      <section class="checkout-card summary-card">
        <div><span>Subtotal makanan</span><b id="subtotal">Rp0</b></div>
        <div><span>Biaya antar</span><b id="delivery-fee">Rp5.000</b></div>
        <div class="summary-total"><span>Total pembayaran</span><b id="summary-total">Rp0</b></div>
      </section>
      <p id="checkout-feedback" role="status"></p>
    </form>
  </main>

  <aside class="checkout-dock">
    <div><small>Total pembayaran</small><strong id="checkout-total">Pilih menu dulu</strong></div>
    <button class="checkout-btn" type="submit" form="checkout">Buat pesanan</button>
  </aside>

  <script src="common.js?v=3"></script>
  <script src="cart.js?v=7"></script>
<script src="push.js?v=2"></script></body>
</html>
