<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4CAF50"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Daftar Member — PrasEats</title><link rel="icon" type="image/avif" href="images/praseats.avif"><link rel="stylesheet" href="styles.css?v=38"></head><body><header><a class="brand" href="index.html"><span class="brand-logo"><img src="images/praseats.avif" alt=""></span>PrasEats</a></header><main class="auth-page"><section class="auth-card"><p class="eyebrow">MEMBER BARU</p><h1>Daftar</h1><p>Buat akun untuk menyimpan identitas pemesanan.</p><form id="register-form"><label>Nama lengkap<input name="name" autocomplete="name" required enterkeyhint="next"></label><label>WhatsApp<input name="whatsapp" type="tel" autocomplete="tel" placeholder="08xxxxxxxxxx" required enterkeyhint="next"></label><label>Alamat rumah / pengantaran<textarea name="homeAddress" rows="3" autocomplete="street-address" placeholder="Tulis alamat lengkap untuk pengantaran" required></textarea></label><label>Detail rumah / patokan <span>(opsional)</span><textarea name="homeDetail" rows="2" placeholder="Contoh: pagar hitam, depan mushola, rumah pojok"></textarea></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="6" required enterkeyhint="go"></label><button type="submit">Daftar</button></form><p id="auth-feedback" class="auth-feedback"></p><p class="auth-switch">Sudah punya akun? <a href="login.html">Login</a></p></section></main><script src="common.js?v=3"></script><script src="auth.js?v=5"></script><script src="floating-cart.js?v=4"></script><script src="public-chat.js?v=3"></script></body></html>
