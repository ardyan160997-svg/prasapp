<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1869ff"><title>Cashflow · Admin PrasCell</title><link rel="icon" type="image/avif" href="images/icon.avif?v=2"><link rel="stylesheet" href="styles.css?v=23"></head>
<body class="admin-page-cashflow"><aside class="sidebar"><div class="brand brand-logo"><img class="brand-mark" src="images/prascelllogo.avif?v=2" alt=""><img class="brand-wordmark" src="images/prascelltag.avif?v=2" alt="PrasCell"><span class="admin-label">Admin</span></div><nav class="admin-menu-slider" aria-label="Menu admin"></nav></aside><main class="main"><section id="login" class="login-card"><h1>Admin PrasCell</h1><p>Masuk untuk melihat revenue dan cashflow.</p><form id="login-form"><input id="password" type="password" placeholder="Password admin" required><button>Masuk</button></form><p id="login-feedback"></p></section><section id="app" class="hidden"><header class="page-head"><div><p>Keuangan</p><h1>Revenue & Cashflow</h1></div><button id="refresh">Refresh</button></header><div id="cashflow-summary" class="cashflow-summary"></div><section class="card"><div class="card-heading"><div><h2>Catat transaksi manual</h2><p class="section-note">Income order, purchasing, dan biaya sparepart terhubung otomatis. Form ini untuk transaksi lainnya.</p></div></div><form id="cashflow-form" class="grid-form cashflow-form"><label class="field-label"><span>Tipe</span><select name="type"><option value="income">Income</option><option value="outcome">Outcome</option></select></label><label class="field-label"><span>Nominal</span><input name="amount" type="number" min="1" required></label><label class="field-label"><span>Kategori</span><input name="category" placeholder="Operasional"></label><label class="field-label"><span>Tanggal</span><input name="occurredAt" type="datetime-local"></label><label class="field-label cashflow-description"><span>Keterangan</span><input name="description" required placeholder="Contoh: biaya listrik toko"></label><button>Catat transaksi</button></form><p id="cashflow-feedback"></p></section><section class="card"><h2>Riwayat Cashflow</h2><div id="cashflow-list" class="cashflow-list"></div></section></section></main><nav class="admin-bottom-nav" aria-label="Navigasi admin"></nav><script src="admin-shell.js?v=2"></script><script src="cashflow.js?v=1"></script></body></html>
