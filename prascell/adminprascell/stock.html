<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1869ff"><title>Stok Barang · Admin PrasCell</title><link rel="icon" type="image/avif" href="images/icon.avif?v=2"><link rel="stylesheet" href="styles.css?v=20"></head>
<body class="admin-page-stock"><aside class="sidebar"><div class="brand brand-logo"><img class="brand-mark" src="images/prascelllogo.avif?v=2" alt=""><img class="brand-wordmark" src="images/prascelltag.avif?v=2" alt="PrasCell"><span class="admin-label">Admin</span></div><nav class="admin-menu-slider" aria-label="Menu admin"></nav></aside>
<main class="main"><section id="login" class="login-card"><h1>Admin PrasCell</h1><p>Masuk untuk mengelola stok barang dan sparepart.</p><form id="login-form"><input id="password" type="password" placeholder="Password admin" required><button>Masuk</button></form><p id="login-feedback"></p></section><section id="app" class="hidden"><header class="page-head"><div><p>Inventori</p><h1>Stok Barang & Sparepart</h1></div><button id="refresh">Refresh</button></header><section class="card"><div class="card-heading"><div><h2 id="stock-form-title">Tambah barang</h2><p class="section-note">Setiap perubahan jumlah disimpan dalam riwayat stok.</p></div></div><form id="stock-form" class="grid-form stock-form"><input name="id" type="hidden"><label class="field-label"><span>Nama barang</span><input name="name" required placeholder="Contoh: LCD Samsung A55"></label><label class="field-label"><span>SKU</span><input name="sku" placeholder="LCD-A55"></label><label class="field-label"><span>Kategori</span><input name="category" value="Sparepart"></label><label class="field-label"><span>Jumlah stok</span><input name="quantity" type="number" min="0" value="0" required></label><label class="field-label"><span>Batas minimum</span><input name="minimumStock" type="number" min="0" value="0" required></label><label class="field-label"><span>Harga beli</span><input name="buyPrice" type="number" min="0" value="0"></label><label class="field-label"><span>Harga jual</span><input name="sellPrice" type="number" min="0" value="0"></label><label class="field-label"><span>Lokasi</span><input name="location" placeholder="Rak A1"></label><label class="field-label"><span>Jenis perubahan</span><select name="movementType"><option value="adjustment">Penyesuaian</option><option value="purchase">Purchasing / pembelian</option></select></label><label class="field-label"><span>Catatan perubahan</span><input name="movementNotes" placeholder="Restok supplier / koreksi stok"></label><label class="field-label stock-notes"><span>Catatan barang</span><textarea name="notes"></textarea></label><label class="warranty-toggle"><input name="isActive" type="checkbox" checked><span>Barang aktif</span></label><div class="form-actions"><button>Simpan barang</button><button id="stock-reset" class="button-muted" type="button">Reset</button></div></form><p id="stock-feedback" class="feedback"></p></section><section class="card"><h2>Daftar Stok</h2><div id="stock-list" class="stock-grid"></div></section></section></main>
<nav class="admin-bottom-nav" aria-label="Navigasi admin"></nav><script src="admin-shell.js?v=2"></script><script src="stock.js?v=2"></script></body></html>
