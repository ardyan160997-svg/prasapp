<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1677ff"><title>Request Pickup — Prashine</title><link rel="icon" type="image/avif" href="images/prashinelogo.avif?v=1"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=10"><link rel="stylesheet" href="pickup.css?v=1"><link rel="stylesheet" href="chat.css?v=2"></head><body data-page="pickup"><main><section class="page-hero"><span>REQUEST PICKUP</span><h1>Kapan kami jemput?</h1><p>Isi alamat dan jadwal. Share GPS membantu kurir menemukan rumahmu.</p></section><section class="pickup"><div id="guest-message" class="notice">Masuk sebagai member untuk membuat request pickup.</div><form id="pickup-form" hidden><label>Layanan<select name="serviceId" id="service-select" required><option value="1" data-name="cuci kering">Cuci Kering · Rp6.000/kg</option><option value="2" data-name="cuci setrika">Cuci Setrika · Rp8.000/kg</option><option value="3" data-name="setrika saja">Setrika Saja · Rp5.000/kg</option></select></label><label>Jadwal jemput<input name="pickupAt" type="datetime-local" required></label><label>Alamat penjemputan<textarea name="address" rows="3" required></textarea></label><button class="location" type="button" id="share-location">⌖ Share lokasi GPS</button><small id="location-status">Opsional, membantu kurir menemukan lokasi.</small><label class="check"><input name="express" type="checkbox"> Express (+Rp5.000/kg)</label><label>Catatan<textarea name="notes" rows="2" placeholder="Patokan rumah, jenis pakaian, atau pesan untuk kurir"></textarea></label><button class="primary" type="submit">Buat Request Jemput</button><p id="pickup-feedback"></p></form></section></main><script src="app.js?v=7"></script><script src="pickup.js?v=6"></script><script src="chat.js?v=2"></script></body></html>
